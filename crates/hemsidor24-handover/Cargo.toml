[package]
name = "hemsidor24-handover"
description = "Signed ownership handover, over the first-party Sijill handoff dialect."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Everything here is optional and off unless `handover` is on.
#
# Pinned to an exact revision rather than a tag. `sijill-dialect-handoff` — the
# first-party custody dialect this crate now speaks — landed after the v0.3.0
# baseline and is not part of that tag, so 17dd4cf is the earliest revision
# that carries it. A revision pin is what the protocol's own README recommends
# when a build has to produce the same bytes years later, which is exactly what
# a handover record has to do. The API this crate uses is unchanged between
# v0.3.0 and here: sijill-dialect is byte-identical, sijill-core's only edit is
# a doc comment, and sijill-cell added documentation and no public item.
[dependencies]
hemsidor24-core = { workspace = true, optional = true }
sijill-cell = { git = "https://github.com/abdulwahed-sweden/sijill-protocol.git", rev = "17dd4cf00baf4e3630840759e00770a7ba03c741", optional = true }
sijill-core = { git = "https://github.com/abdulwahed-sweden/sijill-protocol.git", rev = "17dd4cf00baf4e3630840759e00770a7ba03c741", optional = true }
sijill-dialect = { git = "https://github.com/abdulwahed-sweden/sijill-protocol.git", rev = "17dd4cf00baf4e3630840759e00770a7ba03c741", optional = true }
sijill-dialect-handoff = { git = "https://github.com/abdulwahed-sweden/sijill-protocol.git", rev = "17dd4cf00baf4e3630840759e00770a7ba03c741", optional = true }
thiserror = { workspace = true, optional = true }

[features]
default = []
handover = [
    "dep:hemsidor24-core",
    "dep:sijill-cell",
    "dep:sijill-core",
    "dep:sijill-dialect",
    "dep:sijill-dialect-handoff",
    "dep:thiserror",
]

[[example]]
name = "receipt"
required-features = ["handover"]
