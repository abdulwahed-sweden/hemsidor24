[package]
name = "hemsidor24-handover"
description = "Signed handover of control, over the first-party Sijill handoff dialect."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Everything here is optional and off unless `handover` is on.
#
# Pinned to an exact revision: 17dd4cf, released upstream as v0.4.0. The
# revision is what Cargo resolves and what makes the build reproducible, which
# is what the protocol's own README recommends when a build has to produce the
# same bytes years later — exactly what a handover record has to do. The tag is
# the same commit under a human-readable name; it is recorded here so a reader
# knows which released baseline this is, not because Cargo uses it.
#
# `sijill-dialect-handoff` — the first-party custody dialect this crate speaks —
# is part of that baseline.
[dependencies]
hemsidor24-core = { workspace = true, optional = true }
sijill-cell = { git = "https://github.com/abdulwahed-sweden/sijill-protocol.git", rev = "17dd4cf00baf4e3630840759e00770a7ba03c741", optional = true }
sijill-core = { git = "https://github.com/abdulwahed-sweden/sijill-protocol.git", rev = "17dd4cf00baf4e3630840759e00770a7ba03c741", optional = true }
sijill-dialect = { git = "https://github.com/abdulwahed-sweden/sijill-protocol.git", rev = "17dd4cf00baf4e3630840759e00770a7ba03c741", optional = true }
sijill-dialect-handoff = { git = "https://github.com/abdulwahed-sweden/sijill-protocol.git", rev = "17dd4cf00baf4e3630840759e00770a7ba03c741", optional = true }
thiserror = { workspace = true, optional = true }

[features]
default = []
handover = [
    "dep:hemsidor24-core",
    "dep:sijill-cell",
    "dep:sijill-core",
    "dep:sijill-dialect",
    "dep:sijill-dialect-handoff",
    "dep:thiserror",
]

[[example]]
name = "receipt"
required-features = ["handover"]

[[example]]
name = "inspect"
required-features = ["handover"]
